services:
  db:
    image: postgres:14
    container_name: postgres-dev
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d marketplace -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: marketplace:dev
    container_name: marketplace-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/marketplace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: pgpass
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: